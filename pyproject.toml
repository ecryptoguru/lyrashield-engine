[project]
name = "lyrashield-engine"
version = "1.2.1"
description = "LyraShield AI scan engine, based on Strix"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
  { name = "LyraShield" },
]
maintainers = [
  { name = "LyraShield" },
]
keywords = [
  "cybersecurity",
  "security",
  "vulnerability",
  "scanner",
  "pentest",
  "agent",
  "ai",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Topic :: Security",
  "License :: OSI Approved :: Apache Software License",
  "Environment :: Console",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  # The former git-SHA pin first shipped in 0.19; the reviewed <0.23 ceiling
  # preserves compatibility with this 0.x SDK.
  "openai-agents[litellm]>=0.19.0,<0.23",
  # Keep the SDK within the reviewed openai-agents and LiteLLM compatibility range.
  "openai>=2.48.0,<3.2",
  # Compatible-release pin reviewed in dependency update #77.
  "litellm~=1.90.7",
  "jinja2>=3.1.6",
  "pyyaml>=6.0.3",
  "httpx>=0.28.1",
  # The engine imports `McpError`, retained through MCP SDK 1.x but renamed in
  # 2.x. Keep fresh wheel installs within the API line verified by the lock.
  "mcp>=1.28.1,<2",
  "python-dotenv>=1.2.2",
  "pygments>=2.20.0",
  "pydantic>=2.11.3",
  "pydantic-settings>=2.13.0",
  "rich",
  "docker>=7.1.0",
  "textual>=6.0.0",
  "requests>=2.32.0",
  # Owned direct import (lyrashield/interface/local_sources.py URL parsing);
  # previously satisfied only transitively (DE-17).
  "yarl>=1.18,<2",
  "cvss>=3.2",
  "caido-sdk-client>=0.2.0",
  # Security-fixed line; Intel macOS release builds compile against static OpenSSL.
  "cryptography>=50.0.0,<51",
  # OS keychain storage for BYOK credentials (ChatGPT OAuth token, Azure keys)
  # and the local results-store envelope key. Never written to plaintext files.
  "keyring>=25.0.0",
]

[project.optional-dependencies]
# Encrypted PDF export for the local viewer (`strix view`). Imported lazily by
# strix/viewer/server.py, and the LyraShield worker never runs the viewer, so
# these stay out of the base install rather than shipping in every scan image.
viewer = ["reportlab>=4.0", "pypdf>=6.19.0", "markdown-it-py>=3.0.0"]

[project.scripts]
lyrashield = "lyrashield_adapter.cli:main"
# LyraShield Local TUI — a desktop-friendly terminal UI that shells into the
# engine CLI. Lives outside the lyrashield_adapter/ and strix/** boundary.
lyrashield-local = "lyrashield.tui:run_tui"

[dependency-groups]
audit = [
  "pip-audit==2.10.1",
]
dev = [
  "mypy>=1.16.0",
  "ruff>=0.11.13",
  "bandit>=1.8.3",
  "pre-commit>=4.2.0",
  "pyinstaller>=6.17.0; python_version >= '3.12' and python_version < '3.15'",
  "lyrashield-engine[viewer]",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
faulthandler_timeout = 120
markers = ["upstream_only: inherited upstream Cloud and MCP tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
skip-excluded-dirs = true
exclude = ["/.coverage"]

[tool.hatch.build.targets.wheel]
packages = ["strix", "lyrashield_adapter", "lyrashield"]
# The prebuilt viewer bundle under lyrashield/interface/viewer/static/ ships automatically
# (hatchling includes non-.py files under the package). The Vite SOURCE lives
# under the package dir too but must never ship in the wheel.
exclude = [
    "/.coverage*",
    "/.superpowers/**",
    "/reports/**",
    "/coverage/**",
    "/coverage.xml",
    "/coverage.json",
    "/htmlcov/**",
    "strix/interface/viewer/frontend",
    "strix/interface/viewer/frontend/**",
    "lyrashield/interface/viewer/frontend",
    "lyrashield/interface/viewer/frontend/**",
    "strix/interface/tui/**/*.go",
    "strix/interface/tui/go.mod",
    "strix/interface/tui/go.sum",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.coverage*",
    "/.superpowers/**",
    "/reports/**",
    "/coverage/**",
    "/coverage.xml",
    "/coverage.json",
    "/htmlcov/**",
    "/.worktrees",
    "/tests/**",
    "/strix/interface/viewer/frontend/**",
    "/lyrashield/interface/viewer/frontend/**",
]

# ============================================================================
# Type Checking Configuration
# ============================================================================

[tool.mypy]
python_version = "3.12"
strict = true

# Keep only the upstream Go/Bubble Tea sidecar TUI tree and tests outside the
# strict source gate. The owned interface TUI, Local TUI, and viewer are
# maintained product code and are checked.
exclude = [
    "strix/interface/tui",
    "tests",
]
strict_optional = true
warn_redundant_casts = false
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_configs = true
show_error_codes = true
show_column_numbers = true
pretty = true
disable_error_code = ["redundant-cast"]

# Allow some flexibility for third-party libraries
[[tool.mypy.overrides]]
module = [
    "litellm.*",
    "rich.*",
    "jinja2.*",
    "textual.*",
    "cvss.*",
    "docker.*",
    "caido_sdk_client.*",
    "pydantic_settings.*",
    "reportlab.*",
    "pypdf.*",
    "yaml.*",
    "pygments.*",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["strix.tools.web_search.tool", "strix.telemetry.posthog"]
disable_error_code = ["arg-type"]

# ============================================================================
# Ruff Configuration (Fast Python Linter & Formatter)
# ============================================================================

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "migrations",
]

[tool.ruff.lint]
# Enable comprehensive rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    "S",   # flake8-bandit
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "EM",  # flake8-errmsg
    "FA",  # flake8-future-annotations
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PD",  # pandas-vet
    "PGH", # pygrep-hooks
    "PL",  # Pylint
    "TRY", # tryceratops
    "FLY", # flynt
    "PERF", # Perflint
    "RUF", # Ruff-specific rules
]

ignore = [
    "S101",   # Use of assert
    "S104",   # Possible binding to all interfaces
    "S301",   # Use of pickle
    "COM812", # Missing trailing comma (handled by formatter)
    "ISC001", # Single line implicit string concatenation (handled by formatter)
    "PLR0913", # Too many arguments to function call
    "PLR0917", # Too many positional arguments
    "PLR0911", # Too many return statements
    "TRY003",  # Avoid specifying long messages outside the exception class
    "EM101",   # Exception must not use a string literal
    "EM102",   # Exception must not use an f-string literal
    "FBT001",  # Boolean positional arg in function definition
    "FBT002",  # Boolean default positional argument in function definition
    "G004",    # Logging statement uses f-string
    "PLR2004", # Magic value used in comparison
    "SLF001",  # Private member accessed
]

[tool.ruff.lint.per-file-ignores]
# Benchmark scripts: fixed-argv subprocess calls and intentional stdout output.
"benchmarks/*.py" = ["S603", "S607", "T201", "BLE001", "PLW1510"]
# Test doubles use fixture tokens/passwords and match a callee signature whose
# args they intentionally ignore.
"tests/test_viewer_auth.py" = ["S105", "S106", "ARG001"]
"tests/upstream/test_cloud_cli.py" = ["S105", "ARG001"]
"tests/test_codex_auth.py" = ["S105", "S106", "SLF001"]
# Stdlib HTTP handler overrides (do_GET/do_POST).
"strix/interface/auth_cli.py" = ["N802", "BLE001", "RUF100"]
"tests/test_codex_streaming.py" = ["N802"]
"tests/test_disable_streaming.py" = ["N802"]
"tests/test_report_pdf.py" = ["S105", "S106", "E402", "I001"]
# Fake MCP server matches the SDK's MCPServer signature; its args are unused.
"tests/upstream/test_mcp_client.py" = ["S105", "S106", "ARG002"]
"tests/test_runner_root_prompt_strix.py" = ["S106"]
# Stdlib HTTP handler overrides (do_GET/do_POST) and lazy imports that avoid a
# circular dependency with strix.telemetry / strix.interface.viewer.report_pdf.
"strix/interface/viewer/server.py" = ["N802", "PLC0415", "BLE001", "RUF100"]
"strix/interface/cloud/payment_proxy.py" = ["N802"]
# Upstream v1.6.2 retains PLR0911 noqa directives for a rule our global ignore
# list already disables; keep the substrate bytes verbatim instead of stripping.
"strix/interface/cloud/*.py" = ["RUF100"]
"strix/interface/completions.py" = ["RUF100"]
"strix/interface/platform_cli.py" = ["RUF100"]
# Lazy telemetry import to avoid importing PostHog before the viewer starts.
"strix/interface/viewer/cli.py" = ["PLC0415"]
# Lazy imports inside functions to avoid circular dependency with
# strix.telemetry / strix.report.dedupe / cvss.
"strix/tools/notes/tools.py" = ["PLC0415", "TC002"]
"strix/tools/finish/tool.py" = ["PLC0415", "TC002"]
"strix/tools/reporting/tool.py" = ["PLC0415", "TC002"]
"strix/tools/**/*.py" = [
    "ARG001", # Unused function argument (tools may have unused args for interface consistency)
    "RUF100", # Upstream v1.5.3 retains noqa directives for rules we do not enable
]
# Lazy imports of strix.tools.mcp.client avoid a circular import (client imports
# the session module at module load).
"strix/tools/mcp/session.py" = ["PLC0415"]
# call_mcp is a chain of guard clauses that each return an error string.
"strix/tools/mcp/agent_tools.py" = ["PLR0911"]
"strix/tools/web_search/tool.py" = ["PLC0415", "RUF100", "TC002"]
# The generated Caido GraphQL schema is slow to import, so the SDK is imported
# on first proxy call instead of at module scope (keeps it off the launch path).
"strix/tools/proxy/caido_api.py" = ["PLC0415"]
"strix/runtime/caido_bootstrap.py" = ["PLC0415"]
# LiteLLM and the compaction helpers are imported on first use, not at module
# scope: they cost seconds and are unneeded until a model call is made.
"strix/report/pricing.py" = ["PLC0415"]
"strix/llm/compaction.py" = ["PLC0415"]
"strix/llm/context_budget.py" = ["PLC0415"]
"strix/interface/tui/runtime.py" = ["PLC0415"]
"lyrashield/tools/web_search/tool.py" = ["PLC0415"]
"lyrashield/tools/reporting/tool.py" = ["PLC0415"]
"lyrashield/tools/finish/tool.py" = ["PLC0415", "TC002"]
"lyrashield/tools/proxy/caido_api.py" = ["ARG001"]
"lyrashield/policy/models.py" = ["PLC0415"]
"lyrashield/lifecycle/*.py" = ["PLR0912", "PLR0915", "PLC0415"]
"lyrashield/runtime/*.py" = ["BLE001", "TC002", "TC003"]
"strix/core/**/*.py" = ["RUF100"]
"strix/runtime/**/*.py" = ["RUF100"]
"strix/llm/**/*.py" = ["RUF100"]
"lyrashield/policy/codex.py" = ["PLC0415"]
"lyrashield/policy/loader.py" = ["PLC0415"]
# Custom Docker subclass duplicates parent body; some imports are for annotations.
# Backend factories import their backend's deps lazily so deployments
# that pick a different backend don't need every backend's libs installed.
"strix/runtime/backends.py" = ["PLC0415"]
"strix/runtime/docker_client.py" = [
    "TC002",  # Manifest, Container imported for annotations
    "TC003",  # uuid imported for annotation
]
# SDK function-tool wrappers: the SDK calls get_type_hints() at registration
# time to derive the JSON schema, which evaluates annotations at runtime —
# so RunContextWrapper / Tool / TResponseInputItem must be imported eagerly,
# not under TYPE_CHECKING.
"strix/tools/todo/tools.py" = ["TC002"]
"strix/tools/thinking/tool.py" = ["TC002"]
"strix/tools/proxy/tools.py" = ["TC002", "PLR0911"]
"strix/tools/agents_graph/tools.py" = ["TC002"]
"strix/agents/factory.py" = ["TC002"]
# Entry point: ``Path`` is used at runtime by the typing of the
# session_manager call; importing under TYPE_CHECKING would defer
# resolution past where mypy needs it.
"strix/core/runner.py" = ["TC003", "PLR0912", "PLR0915", "PLC0415"]
# ReportState carries scan artifact/report fields and
# a runtime ``Callable`` annotation on ``vulnerability_found_callback``.
"strix/report/state.py" = ["TC003", "PLR0912", "PLR0915", "E501", "PERF401", "PLC0415"]
"strix/report/usage.py" = ["PLC0415"]
# Lazy import of strix.config.models avoids a circular dependency between the
# report pipeline and the config layer.
"strix/report/dedupe.py" = ["PLC0415"]
"strix/telemetry/logging.py" = ["PLC0415"]
"strix/config/models.py" = ["PLC0415"]
# Heavy inference deps (httpx, openai) imported lazily so auth-status checks
# don't pull them in.
"strix/config/codex.py" = ["PLC0415"]
# Interface utility branches per scope-mode / target-type combination;
# splitting would obscure the decision tree without simplifying it.
"strix/interface/utils.py" = ["PLR0912", "BLE001", "PLC0415", "RUF100"]
# CLI / TUI / main keep extensive lazy imports + broad exception
# swallows for resilience around terminal-rendering errors.
"strix/interface/cli.py" = ["BLE001", "PLC0415"]
"strix/interface/main.py" = ["BLE001", "PLC0415", "PLR0912", "PLR0915"]
"strix/interface/viewer/transcript.py" = ["PLC0415"]
"strix/runtime/session_manager.py" = ["BLE001"]
"strix/core/execution.py" = ["PLR0912", "PLC0415"]

# Upstream v1.5.3 interface modules restored after product code moved to lyrashield/interface.
"strix/interface/cli_args.py" = ["BLE001", "PLC0415", "PLR0912", "PLR0915"]
"strix/interface/environment.py" = ["PLC0415", "PLR0912", "PLR0915"]
"strix/interface/interactive.py" = ["PLC0415"]
"strix/interface/scan_setup.py" = ["PLC0415", "PLR0912", "PLR0915"]
"strix/interface/tui/backend/*.py" = ["PLC0415", "RUF100"]

# Product modules moved from strix/ to lyrashield/.
"lyrashield/artifacts/*.py" = ["PLR0912", "PLR0915", "PLC0415", "TC003"]
"lyrashield/interface/*.py" = ["BLE001", "PLC0415", "PLR0912", "PLR0915"]
"lyrashield/interface/tui/app.py" = ["BLE001", "PLC0415", "PLR0912", "PLR0915", "SIM105"]
"lyrashield/interface/tui/renderers/*.py" = ["PLC0415"]
"lyrashield/tools/agents_graph/tools.py" = ["PLR0911", "PLC0415"]
"lyrashield/tools/output_store.py" = ["PLC0415"]
# The results store tests use fixed test keys for its envelope-encryption helpers.
"tests/tui/*.py" = ["S101", "S105", "S106", "SLF001", "PLC0415", "T201", "ARG001", "ARG005", "BLE001", "S603", "S607", "F401", "E501", "I001", "RUF100", "TC001", "TC002", "TC003", "FBT003", "SIM105"]

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 2
known-first-party = ["strix", "lyrashield"]
known-third-party = ["pydantic"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================================
# Bandit Configuration (Security Linting)
# ============================================================================

[tool.bandit]
exclude_dirs = ["docs", "build", "dist"]
skips = ["B101", "B105", "B601", "B404", "B603", "B607"]  # Skip assert, hardcoded-password false positives, shell injection, subprocess import and partial path checks
# Bandit reads no severity floor from this file. Only the `-l/--level` CLI flag
# filters, so a `severity = "medium"` key here was inert and misdescribed the
# gate. It is deliberately absent: the enforced floor is LOW, and the
# invocations (Makefile `security`, .pre-commit-config.yaml, and
# scripts/verify-controlled-derivative.sh) carry the explicit `-l` flag that
# enforces it. A medium floor would drop B311, B403 and B405-B409, and the ruff
# equivalents of B403/B405-B409 (S403, S405-S409) are preview-only and inactive
# in this repo, so enforcing medium would silently weaken the security gate.
