version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"
    ignore:
      - dependency-name: charset-normalizer
        # dirsearch 0.4.3.post1 requires the older major; revisit with DE-20.
        update-types:
          - version-update:semver-major
