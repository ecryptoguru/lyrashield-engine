name: Engine CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Provision deny-by-default sandbox network
        run: |
          bash scripts/provision-sandbox-network.sh
          echo "STRIX_DOCKER_SANDBOX_NETWORK=lyrashield-sandbox" >> "$GITHUB_ENV"

      - name: Verify source and policy gates
        run: scripts/verify-controlled-derivative.sh

      - name: Verify Python packages and CLI
        run: |
          uv build
          uv run lyrashield --version

      - name: Ruff lint and format check
        run: |
          uv run ruff check --no-fix .
          uv run ruff format --check .

      - name: Mypy type check
        run: uv run mypy strix lyrashield_adapter

      - name: Bandit security scan
        run: uv run bandit -c pyproject.toml -r strix lyrashield_adapter

      - name: Run test suite
        run: uv run pytest -q

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Desktop logic crate tests (cargo test)
        # Pure Rust crate shared by the Tauri shell. Exercises the real
        # bundled-revocation-list, Azure endpoint, and license verification paths.
        # `--locked` is omitted because the crate's Cargo.lock is gitignored;
        # tests are still deterministic once the lock resolves.
        working-directory: desktop/logic
        env:
          LYRASHIELD_REVOCATION_LIST_JSON: '[{"license_id":"revoked-ci-test","reason":"ci"}]'
        run: cargo test

      - name: Desktop logic tests (cargo test)
        # Runs the standalone crate in desktop/tests — no Tauri context needed
        # (tauri::generate_context! requires the built frontend dist). This is
        # where the cross-language license golden vector (Node-signed canonical
        # JSON, Rust-verified exact bytes) is enforced; without this step the
        # desktop license round-trip had no CI coverage.
        # We also compile in a non-empty revocation list to exercise the
        # build-time bundled-list path and prove revoked licenses fail admission.
        working-directory: desktop/tests
        env:
          LYRASHIELD_REVOCATION_LIST_JSON: '[{"license_id":"revoked-ci-test","reason":"ci"}]'
        run: cargo test --locked

      - name: Verify native release binary
        run: bash scripts/build.sh

      - name: Read pinned worker-consumer revision
        id: worker_pin
        run: |
          WORKER_PIN=$(tr -d '[:space:]' < .lyrashield-worker-pin)
          if [ -z "$WORKER_PIN" ]; then
            echo "::error::.lyrashield-worker-pin is missing or empty"
            exit 1
          fi
          echo "WORKER_PIN=$WORKER_PIN" >> "$GITHUB_ENV"
          echo "WORKER_PIN=$WORKER_PIN" >> "$GITHUB_OUTPUT"

      - name: Check out public LyraShield app contract
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ecryptoguru/lyrashield-ai
          ref: ${{ steps.worker_pin.outputs.WORKER_PIN }}
          path: .ci/lyrashield-ai
          fetch-depth: 1
          persist-credentials: false

      - name: Verify worker compatibility
        run: scripts/verify-worker-contract.sh "$GITHUB_WORKSPACE/.ci/lyrashield-ai"

      - name: Upload release diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-ci-diagnostics-${{ github.run_id }}
          path: |
            dist/
            build/
          if-no-files-found: ignore
          retention-days: 7

  desktop-shell:
    name: Verify and package Desktop shell
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-22
        with:
          components: clippy,rustfmt

      - name: Install Linux Desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Verify Desktop source
        run: |
          npm ci --prefix desktop/ui
          npm --prefix desktop/ui run build
          npm audit --prefix desktop/ui
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked

      - name: Build version-matched Linux sidecar
        run: |
          bash scripts/build.sh
          ENGINE_VERSION="$(./dist/strix --version | awk '{print $NF}' | tr -d '[:space:]')"
          EXPECTED_VERSION="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$ENGINE_VERSION" = "$EXPECTED_VERSION"
          mkdir -p desktop/src-tauri/binaries
          cp dist/strix desktop/src-tauri/binaries/lyrashield-engine-x86_64-unknown-linux-gnu
          chmod +x desktop/src-tauri/binaries/lyrashield-engine-x86_64-unknown-linux-gnu

      - name: Build unsigned Debian package
        uses: tauri-apps/tauri-action@2d793bf2c8c505b9b76211601b09aab48922225d # v1.0.0
        env:
          LYRASHIELD_LICENSE_PUBKEY_HEX: 1111111111111111111111111111111111111111111111111111111111111111
        with:
          projectPath: desktop/src-tauri
          args: >-
            --bundles deb
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Prove package exists
        run: test -n "$(find desktop/src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"

  docker-smoke:
    name: Build and smoke-test sandbox image
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build sandbox image
        run: |
          docker build \
            -f containers/Dockerfile \
            -t lyrashield-sandbox:ci \
            --progress=plain \
            .

      - name: Smoke sandbox image
        run: |
          docker run --rm lyrashield-sandbox:ci sh -lc '
            test "$(id -u)" != "0" &&
            test "$(pwd)" = "/workspace" &&
            test -f /app/certs/ca.p12 &&
            test ! -S /var/run/docker.sock &&
            test "$VIRTUAL_ENV" = "/app/.venv" &&
            test "$HTTP_PROXY" = "http://127.0.0.1:48080" &&
            ! sudo -n true 2>/dev/null &&
            test ! -w /etc &&
            test ! -w /usr/local/bin &&
            caido-cli --version &&
            command -v nmap >/dev/null &&
            getcap /usr/lib/nmap/nmap | grep -q "cap_net_raw" &&
            nmap --version >/dev/null 2>&1 &&
            nmap -sn 127.0.0.1 >/dev/null &&
            /app/.venv/bin/python -c "import caido_api" &&
            status="$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:48080/graphql/)" &&
            case "$status" in 200|400) exit 0 ;; *) exit 1 ;; esac
          '

      - name: Guarded replay egress probes (built image)
        run: |
          docker run --rm lyrashield-sandbox:ci /app/.venv/bin/python -c "
          import socket
          from caido_api import _check_replay_url_host as blocked

          for url in (
              'http://169.254.169.254/',
              'http://100.100.100.200/',
              'http://metadata.google.internal/',
              'http://127.0.0.1:8080/',
              'http://10.0.0.5/',
              'http://192.168.1.1/',
              'http://[::1]/',
              'http://user:pass@10.0.0.5/',
          ):
              assert blocked(url) is not None, url
          assert blocked('https://example.com/') is None

          # DNS rebinding: a hostname resolving into private space is blocked.
          orig_getaddrinfo = socket.getaddrinfo
          def fake_getaddrinfo(host, *args, **kwargs):
              if host == 'rebind.example.net':
                  return [(socket.AF_INET, socket.SOCK_STREAM, 6, '', ('10.9.9.9', 0))]
              return orig_getaddrinfo(host, *args, **kwargs)
          socket.getaddrinfo = fake_getaddrinfo
          assert blocked('http://rebind.example.net/') is not None
          print('replay guard probes passed')
          "

      - name: Deny-by-default network probes (built image)
        run: |
          docker network create --internal ci-sandbox-internal
          trap 'docker network rm ci-sandbox-internal >/dev/null 2>&1 || true' EXIT
          docker run --rm --network ci-sandbox-internal \
            -e STRIX_DOCKER_SANDBOX_NETWORK=ci-sandbox-internal \
            lyrashield-sandbox:ci sh -c '
            # Direct IPv4, IPv6, DNS, metadata, and alternate-client egress
            # (proxy variables unset) must all be denied by the network layer.
            # --fail is required: the Caido proxy on 127.0.0.1:48080 accepts
            # the connection and returns HTTP 500 when the upstream is
            # unreachable. Without --fail, curl treats the 500 as a successful
            # HTTP response (exit 0) and the negation (!) would invert it to
            # a false failure. With --fail, curl exits 22 on the 500, which
            # the negation correctly treats as "egress denied = pass".
              ! curl --fail -sS -m 5 -o /dev/null http://203.0.113.10/ &&
              ! curl --fail -sS -m 5 -o /dev/null "http://[2001:db8::1]/" &&
              ! getent hosts example.com &&
              ! curl --fail -sS -m 5 -o /dev/null http://169.254.169.254/ &&
              ! env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
                   curl --fail -sS -m 5 -o /dev/null http://203.0.113.10/ &&
              echo "network deny probes passed"
          '

      - name: Upload image diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-smoke-diagnostics-${{ github.run_id }}
          path: containers/Dockerfile
          if-no-files-found: ignore
          retention-days: 7
