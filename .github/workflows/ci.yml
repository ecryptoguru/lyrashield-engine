name: Engine CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    name: Audit locked Python dependencies
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Export and audit the locked dependency graph
        run: |
          uv export --frozen --all-extras --all-groups --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/engine-requirements.txt"
          uv run --frozen --group audit pip-audit --require-hashes --disable-pip -r "$RUNNER_TEMP/engine-requirements.txt"

      - name: Audit hash-pinned Dirsearch package
        run: uv run --frozen --group audit pip-audit --require-hashes --disable-pip -r containers/dirsearch-requirements.txt

      - name: Audit hash-pinned sandbox Python dependency lock
        run: uv run --frozen --group audit pip-audit --require-hashes --disable-pip -r containers/python-requirements.txt

      - name: Prove the audit-tool lock rejects tampered artifacts
        run: |
          negative_dir="$RUNNER_TEMP/pip-audit-hash-negative"
          mkdir -p "$negative_dir"
          cp pyproject.toml uv.lock "$negative_dir/"
          NEGATIVE_DIR="$negative_dir" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          lock_path = Path(os.environ["NEGATIVE_DIR"]) / "uv.lock"
          lock = lock_path.read_text()
          start = lock.index('[[package]]\nname = "pip-audit"')
          end = lock.find('\n[[package]]', start + 1)
          block = lock[start:] if end == -1 else lock[start:end]
          tampered = re.sub(r'sha256:[0-9a-f]{64}', 'sha256:' + '0' * 64, block)
          if tampered == block:
              raise SystemExit("pip-audit lock entry has no artifact hash")
          lock_path.write_text(lock[:start] + tampered + ("" if end == -1 else lock[end:]))
          PY
          if UV_CACHE_DIR="$RUNNER_TEMP/pip-audit-hash-negative-cache" uv sync --frozen --no-install-project --no-default-groups --group audit --directory "$negative_dir"; then
            echo "::error::tampered pip-audit artifact hash unexpectedly installed"
            exit 1
          fi

  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: changed_paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 scripts/classify_engine_ci_paths.py --base "$BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
      # The interpreter itself is cheap and also serves the branding gate,
      # which must run even when every expensive Python gate is skipped.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.changed_paths.outputs.docs_only != 'true'
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changed_paths.outputs.docs_only != 'true'
        with:
          node-version: "22"

      - name: Provision deny-by-default sandbox network
        if: steps.changed_paths.outputs.docs_only != 'true'
        run: |
          bash scripts/provision-sandbox-network.sh
          echo "STRIX_DOCKER_SANDBOX_NETWORK=lyrashield-sandbox" >> "$GITHUB_ENV"

      - name: Test optional viewer against base install
        if: steps.changed_paths.outputs.docs_only != 'true'
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/engine-base-env
          LYRASHIELD_TEST_BASE_INSTALL: "1"
        run: >
          uv run --frozen --no-default-groups --with pytest --with pytest-asyncio
          pytest -q tests/test_viewer_extra.py

      - name: Verify source and policy gates
        if: steps.changed_paths.outputs.docs_only != 'true'
        run: scripts/verify-controlled-derivative.sh

      - name: Test owned viewer safety and route handling
        if: steps.changed_paths.outputs.docs_only != 'true'
        run: >
          uv run pytest -q tests/test_viewer.py tests/test_viewer_runs_gating.py
          tests/test_viewer_cli.py tests/test_viewer_safety.py

      - name: Report owned/upstream Python twin drift
        if: steps.changed_paths.outputs.docs_only != 'true'
        run: python3 scripts/report_twin_drift.py

      - name: Verify owned viewer source and committed build
        if: steps.changed_paths.outputs.docs_only != 'true'
        working-directory: lyrashield/interface/viewer/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node --test --test-concurrency=1 tests/*.mjs
          npm run typecheck
          npm run build
          git diff --exit-code -- ../static
          if [ -n "$(git ls-files --others --exclude-standard ../static)" ]; then
            echo "::error::owned viewer build produced untracked static assets"
            exit 1
          fi

      # Customer-facing branding is gated on docs-only changes too: docs/** is
      # part of the checked scope, so skipping this gate would let upstream
      # branding ship through a documentation-only pull request.
      - name: Verify customer branding
        run: python scripts/verify-customer-branding.py

      - name: Verify Python packages and CLI
        if: steps.changed_paths.outputs.docs_only != 'true'
        run: |
          uv build
          uv run lyrashield --version

      - name: Verify native release binary
        if: steps.changed_paths.outputs.docs_only != 'true'
        run: bash scripts/build.sh

      - name: Read pinned worker-consumer revision
        if: steps.changed_paths.outputs.docs_only != 'true'
        id: worker_pin
        run: |
          WORKER_PIN=$(tr -d '[:space:]' < .lyrashield-worker-pin)
          if [ -z "$WORKER_PIN" ]; then
            echo "::error::.lyrashield-worker-pin is missing or empty"
            exit 1
          fi
          echo "WORKER_PIN=$WORKER_PIN" >> "$GITHUB_ENV"
          echo "WORKER_PIN=$WORKER_PIN" >> "$GITHUB_OUTPUT"

      - name: Check out public LyraShield app contract
        if: steps.changed_paths.outputs.docs_only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ecryptoguru/lyrashield-ai
          ref: ${{ steps.worker_pin.outputs.WORKER_PIN }}
          path: .ci/lyrashield-ai
          fetch-depth: 1
          persist-credentials: false

      - name: Verify worker compatibility
        if: steps.changed_paths.outputs.docs_only != 'true'
        run: scripts/verify-worker-contract.sh "$GITHUB_WORKSPACE/.ci/lyrashield-ai"

      - name: Upload release diagnostics
        if: failure() && steps.changed_paths.outputs.docs_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-ci-diagnostics-${{ github.run_id }}
          path: |
            dist/
            build/
          if-no-files-found: ignore
          retention-days: 7

  docker-smoke:
    name: Build and smoke-test sandbox image
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: changed_paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 scripts/classify_engine_ci_paths.py --base "$BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.changed_paths.outputs.docs_only != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build sandbox image
        if: steps.changed_paths.outputs.docs_only != 'true'
        run: |
          docker buildx build \
            -f containers/Dockerfile \
            -t lyrashield-sandbox:ci \
            --cache-from type=gha,scope=engine-sandbox-v1 \
            --cache-to type=gha,mode=max,scope=engine-sandbox-v1 \
            --load \
            --progress=plain \
            .

      - name: Smoke sandbox image
        if: steps.changed_paths.outputs.docs_only != 'true'
        run: bash scripts/smoke-sandbox.sh lyrashield-sandbox:ci

      - name: Relay grant isolation (built image)
        if: steps.changed_paths.outputs.docs_only != 'true'
        run: |
          relay_dir=$(mktemp -d)
          trap 'rm -rf "$relay_dir"' EXIT
          printf '%s' 'http://lrg1.payload.signature@127.0.0.1:1' > "$relay_dir/upstream"
          chmod 0400 "$relay_dir/upstream"
          docker run --rm --mount "type=bind,src=$relay_dir/upstream,dst=/run/lyrashield-relay/upstream,readonly" \
            lyrashield-sandbox:ci sh -lc '
              test -z "${LYRASHIELD_TARGET_RELAY_UPSTREAM:-}" &&
              test ! -r /run/lyrashield-relay/upstream &&
              ps -eo user=,args= | grep -E "^nobody +.*target_relay_proxy.py" &&
              test "$(curl -sS --noproxy "" --proxy http://127.0.0.1:48081 -o /dev/null -w "%{http_code}" http://target.example/)" = "502"
            '

      - name: Guarded replay egress probes (built image)
        if: steps.changed_paths.outputs.docs_only != 'true'
        run: |
          docker run --rm lyrashield-sandbox:ci /app/.venv/bin/python -c "
          import socket
          import ipaddress
          from caido_api import _ip_denial, _replay_denial as blocked

          aws_metadata = _ip_denial(ipaddress.ip_address('fd00:ec2::254'))
          assert aws_metadata is not None and aws_metadata[1] == 'cloud_metadata'

          for url in (
              'http://169.254.169.254/',
              'http://[fd00:ec2::254]/',
              'http://100.100.100.200/',
              'http://metadata.google.internal/',
              'http://127.0.0.1:8080/',
              'http://10.0.0.5/',
              'http://192.168.1.1/',
              'http://[::1]/',
              'http://user:pass@10.0.0.5/',
          ):
              assert blocked(url) is not None, url
          assert blocked('https://example.com/') is None

          # DNS rebinding: a hostname resolving into private space is blocked.
          orig_getaddrinfo = socket.getaddrinfo
          def fake_getaddrinfo(host, *args, **kwargs):
              if host == 'rebind.example.net':
                  return [(socket.AF_INET, socket.SOCK_STREAM, 6, '', ('10.9.9.9', 0))]
              return orig_getaddrinfo(host, *args, **kwargs)
          socket.getaddrinfo = fake_getaddrinfo
          assert blocked('http://rebind.example.net/') is not None
          print('replay guard probes passed')
          "

      - name: Deny-by-default network probes (built image)
        if: steps.changed_paths.outputs.docs_only != 'true'
        run: |
          docker network create --internal ci-sandbox-internal
          trap 'docker network rm ci-sandbox-internal >/dev/null 2>&1 || true' EXIT
          docker run --rm --network ci-sandbox-internal \
            -e STRIX_DOCKER_SANDBOX_NETWORK=ci-sandbox-internal \
            lyrashield-sandbox:ci sh -c '
            # Direct IPv4, IPv6, DNS, metadata, and alternate-client egress
            # (proxy variables unset) must all be denied by the network layer.
            # --fail is required: the Caido proxy on 127.0.0.1:48080 accepts
            # the connection and returns HTTP 500 when the upstream is
            # unreachable. Without --fail, curl treats the 500 as a successful
            # HTTP response (exit 0) and the negation (!) would invert it to
            # a false failure. With --fail, curl exits 22 on the 500, which
            # the negation correctly treats as "egress denied = pass".
              ! curl --fail -sS -m 5 -o /dev/null http://203.0.113.10/ &&
              ! curl --fail -sS -m 5 -o /dev/null "http://[2001:db8::1]/" &&
              ! getent hosts example.com &&
              ! curl --fail -sS -m 5 -o /dev/null http://169.254.169.254/ &&
              ! env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
                   curl --fail -sS -m 5 -o /dev/null http://203.0.113.10/ &&
              echo "network deny probes passed"
          '

  windows-attachment-boundary:
    name: Native Windows attachment boundary
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run attachment tests through native Win32 handles
        run: |
          uv sync --frozen --extra viewer
          uv run pytest -q tests/test_attachments.py
