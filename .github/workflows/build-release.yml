name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: ubuntu-22.04-arm
            target: linux-arm64
          - os: windows-latest
            target: windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Prepare static cryptography build for Intel macOS
        if: matrix.target == 'macos-x86_64'
        shell: bash
        run: |
          brew install openssl@3 rust
          {
            echo "OPENSSL_DIR=$(brew --prefix openssl@3)"
            echo "OPENSSL_STATIC=1"
            echo "UV_NO_BINARY_PACKAGE=cryptography"
          } >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          # The release binary includes PyInstaller hooks for reportlab/pypdf,
          # so the viewer extra must be present at sync time (a bare sync would
          # omit it and the build would succeed while breaking PDF export at
          # runtime).
          uv sync --frozen --extra viewer
          if [[ "${{ matrix.target }}" == "macos-x86_64" ]]; then
            CRYPTOGRAPHY_EXTENSION=$(uv run python -c 'import cryptography.hazmat.bindings._rust as rust; print(rust.__file__)')
            CRYPTOGRAPHY_LINKS=$(otool -L "$CRYPTOGRAPHY_EXTENSION")
            if grep -E 'lib(ssl|crypto).*dylib' <<< "$CRYPTOGRAPHY_LINKS"; then
              echo "::error::cryptography must statically link OpenSSL for distribution"
              exit 1
            fi
          fi
          uv run pyinstaller strix.spec --noconfirm

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            dist/strix.exe --version
          else
            dist/strix --version
          fi

          if [[ "${{ matrix.target }}" == "linux-arm64" ]]; then
            file dist/strix
            file dist/strix | grep -q "ARM aarch64" || {
              echo "::error::linux-arm64 artifact is not an ARM aarch64 binary"
              exit 1
            }
          fi

          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          mkdir -p dist/release

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp dist/strix.exe "dist/release/strix-${VERSION}-${{ matrix.target }}.exe"
            (cd dist/release && 7z a "strix-${VERSION}-${{ matrix.target }}.zip" "strix-${VERSION}-${{ matrix.target }}.exe")
          else
            cp dist/strix "dist/release/strix-${VERSION}-${{ matrix.target }}"
            chmod +x "dist/release/strix-${VERSION}-${{ matrix.target }}"
            tar -C dist/release -czvf "dist/release/strix-${VERSION}-${{ matrix.target }}.tar.gz" "strix-${VERSION}-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strix-${{ matrix.target }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums and sign them
        # Deep Review v16 4.2: release archives previously published with no
        # checksum file and no signature. Every release now ships SHA256SUMS,
        # an ed25519 signature over the checksum file, and the matching public
        # key so customers can verify both. Fails closed when the signing
        # secrets are absent — never silently publishes unsigned.
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ secrets.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_KEY}" ] || [ -z "${RELEASE_SIGNING_PUBLIC_KEY}" ]; then
            echo "::error::RELEASE_SIGNING_KEY / RELEASE_SIGNING_PUBLIC_KEY secrets are required to publish a release."
            exit 1
          fi
          cd release
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          printf '%s\n' "${RELEASE_SIGNING_KEY}" > signing-key.pem
          openssl pkeyutl -sign -inkey signing-key.pem -in SHA256SUMS -out SHA256SUMS.sig -rawin
          printf '%s\n' "${RELEASE_SIGNING_PUBLIC_KEY}" > SHA256SUMS.pub
          # Fail the release if the signature does not verify against the
          # published public key — a bad pair must never reach customers.
          openssl pkeyutl -verify -pubin -inkey SHA256SUMS.pub -sigfile SHA256SUMS.sig -in SHA256SUMS -rawin
          rm signing-key.pem
          cat SHA256SUMS

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: release/*

      - name: Upload signed verification bundle
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-verification
          path: release/*
          if-no-files-found: error
