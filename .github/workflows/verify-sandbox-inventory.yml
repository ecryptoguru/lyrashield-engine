name: Independently verify sandbox package inventory

on:
  workflow_dispatch:
    inputs:
      index_digest:
        description: Exact published OCI index digest
        type: string
        required: true
      revision:
        description: Exact published engine and workflow revision
        type: string
        required: true
      run_id:
        description: Sandbox publisher run ID with documented promotion hold
        type: string
        required: true
      run_attempt:
        description: Exact publisher attempt
        type: string
        required: true

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  independent-inventory:
    if: >-
      github.repository_id == '1297157605' &&
      github.repository_owner_id == '116722580' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      receipt-digest: ${{ steps.receipt.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable selector and trusted source
        env:
          INDEX_DIGEST: ${{ inputs.index_digest }}
          ENGINE_REVISION: ${{ inputs.revision }}
          PUBLISH_RUN_ID: ${{ inputs.run_id }}
          PUBLISH_ATTEMPT: ${{ inputs.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ENGINE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PUBLISH_RUN_ID" =~ ^[1-9][0-9]{0,19}$ && "$PUBLISH_ATTEMPT" =~ ^[1-9][0-9]{0,19}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --verify "$ENGINE_REVISION^{commit}")" = "$ENGINE_REVISION"
          git merge-base --is-ancestor "$ENGINE_REVISION" "$GITHUB_SHA"
      - name: Install checksum-pinned protected verification tools
        run: bash scripts/prepare_independent_inventory_tools.sh
      - name: Authenticate and independently verify exact publication
        env:
          GH_TOKEN: ${{ github.token }}
          INDEX_DIGEST: ${{ inputs.index_digest }}
          ENGINE_REVISION: ${{ inputs.revision }}
          PUBLISH_RUN_ID: ${{ inputs.run_id }}
          PUBLISH_ATTEMPT: ${{ inputs.run_attempt }}
        run: |
          set -euo pipefail
          python3 -m scripts.acquire_sandbox_inventory \
            --index-digest "$INDEX_DIGEST" --revision "$ENGINE_REVISION" \
            --run-id "$PUBLISH_RUN_ID" --run-attempt "$PUBLISH_ATTEMPT" \
            --source-repository "$GITHUB_WORKSPACE" \
            --go-tool /usr/local/lib/lyrashield-inventory/go/bin/go \
            --output "$RUNNER_TEMP/independent-sandbox-inventory-raw.json"
      - name: Bind measured inventory to immutable verifier source
        run: |
          set -euo pipefail
          python3 -m scripts.bind_sandbox_inventory \
            --receipt "$RUNNER_TEMP/independent-sandbox-inventory-raw.json" \
            --source-repository "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/independent-sandbox-inventory.json"
      - name: Bound and hash the receipt
        id: receipt
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/independent-sandbox-inventory.json"
          test ! -L "$RUNNER_TEMP/independent-sandbox-inventory.json"
          size=$(stat -c %s "$RUNNER_TEMP/independent-sandbox-inventory.json")
          test "$size" -gt 0 && test "$size" -le 16777216
          digest=$(sha256sum "$RUNNER_TEMP/independent-sandbox-inventory.json" | cut -d ' ' -f 1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: independent-sandbox-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/independent-sandbox-inventory.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish-inventory-attestation:
    needs: independent-inventory
    if: >-
      github.repository_id == '1297157605' &&
      github.repository_owner_id == '116722580' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate acquisition artifact identity
        env:
          ARTIFACT_ID: ${{ needs.independent-inventory.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.independent-inventory.outputs.artifact-digest }}
          RECEIPT_DIGEST: ${{ needs.independent-inventory.outputs.receipt-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RECEIPT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.independent-inventory.outputs.artifact-id }}
          path: ${{ runner.temp }}/inventory-transfer
          skip-decompress: true
          digest-mismatch: error
      - name: Validate transferred receipt before signing
        env:
          ARTIFACT_DIGEST: ${{ needs.independent-inventory.outputs.artifact-digest }}
          RECEIPT_DIGEST: ${{ needs.independent-inventory.outputs.receipt-digest }}
          INDEX_DIGEST: ${{ inputs.index_digest }}
          ENGINE_REVISION: ${{ inputs.revision }}
          PUBLISH_RUN_ID: ${{ inputs.run_id }}
          PUBLISH_ATTEMPT: ${{ inputs.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import os
          import re
          import subprocess
          import zipfile
          from pathlib import Path

          from scripts.bind_sandbox_inventory import VERIFIER_FILES, WORKFLOW
          from scripts.check_sandbox_sbom_coverage import read_regular
          from scripts.verify_oci_layer_binding import read_json
          from scripts.verify_sandbox_package_inventory import SOURCE_FILES

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          env = os.environ
          workspace = Path(env['GITHUB_WORKSPACE'])
          transfer = Path(env['RUNNER_TEMP']) / 'inventory-transfer'
          files = list(transfer.iterdir())
          require(len(files) == 1, 'expected exactly one transferred archive')
          archive = read_regular(files[0], 16 * 1024**2 + 65536)
          require(hashlib.sha256(archive).hexdigest() == env['ARTIFACT_DIGEST'], 'artifact digest mismatch')
          with zipfile.ZipFile(io.BytesIO(archive)) as zf:
              entries = zf.infolist()
              require(len(entries) == 1 and entries[0].filename == 'independent-sandbox-inventory.json', 'unexpected artifact contents')
              require(0 < entries[0].file_size <= 16 * 1024**2, 'receipt size invalid')
              raw = zf.read(entries[0])
          require(hashlib.sha256(raw).hexdigest() == env['RECEIPT_DIGEST'], 'receipt digest mismatch')
          receipt = read_json(raw)
          require(isinstance(receipt, dict), 'invalid receipt')
          verifier = receipt.get('verifier')
          require(isinstance(verifier, dict), 'missing verifier identity')
          require(env['GITHUB_REPOSITORY'] == 'ecryptoguru/lyrashield-engine' and env['GITHUB_REPOSITORY_ID'] == '1297157605' and env['GITHUB_REPOSITORY_OWNER_ID'] == '116722580', 'wrong repository')
          require(env['GITHUB_REF'] == 'refs/heads/main' and env['GITHUB_WORKFLOW_REF'] == 'ecryptoguru/lyrashield-engine/' + WORKFLOW + '@refs/heads/main', 'wrong workflow')
          require(re.fullmatch(r'[0-9a-f]{40}', env['GITHUB_SHA']) and re.fullmatch(r'[0-9a-f]{40}', env['ENGINE_REVISION']) and re.fullmatch(r'sha256:[0-9a-f]{64}', env['INDEX_DIGEST']), 'invalid revision or digest')
          require(all(re.fullmatch(r'[1-9][0-9]{0,19}', env[key]) for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'PUBLISH_RUN_ID', 'PUBLISH_ATTEMPT')), 'invalid run identity')
          def git(*args):
              return subprocess.check_output(['/usr/bin/git', '--no-replace-objects', '-C', str(workspace), *args], timeout=30)
          require(git('rev-parse', 'HEAD').decode().strip() == env['GITHUB_SHA'], 'wrong checkout')
          subprocess.run(['/usr/bin/git', '--no-replace-objects', '-C', str(workspace), 'merge-base', '--is-ancestor', env['ENGINE_REVISION'], env['GITHUB_SHA']], check=True, timeout=30)
          require(receipt.get('schema') == 'lyrashield.sandbox.independent-package-inventory.v1' and receipt.get('status') == 'bounded_scope_matched' and receipt.get('releaseQualified') is False, 'receipt is not a bounded result')
          require(receipt.get('image') == 'ghcr.io/ecryptoguru/lyrashield-sandbox' and receipt.get('indexDigest') == env['INDEX_DIGEST'] and receipt.get('engineRevision') == env['ENGINE_REVISION'] and receipt.get('workflowRevision') == env['ENGINE_REVISION'] and receipt.get('runId') == env['PUBLISH_RUN_ID'] and receipt.get('runAttempt') == env['PUBLISH_ATTEMPT'], 'publication selector mismatch')
          require(verifier.get('repositoryId') == env['GITHUB_REPOSITORY_ID'] and verifier.get('ownerId') == env['GITHUB_REPOSITORY_OWNER_ID'] and verifier.get('revision') == env['GITHUB_SHA'] and verifier.get('tree') == git('rev-parse', env['GITHUB_SHA'] + '^{tree}').decode().strip() and verifier.get('workflow') == WORKFLOW and verifier.get('runId') == env['GITHUB_RUN_ID'] and verifier.get('runAttempt') == env['GITHUB_RUN_ATTEMPT'], 'verifier identity mismatch')
          def source_hashes(revision, paths):
              return {path: 'sha256:' + hashlib.sha256(git('show', revision + ':' + path)).hexdigest() for path in paths}
          require(verifier.get('sourceFiles') == source_hashes(env['GITHUB_SHA'], VERIFIER_FILES), 'verifier source mismatch')
          require(receipt.get('sourceFiles') == source_hashes(env['ENGINE_REVISION'], SOURCE_FILES), 'publisher source mismatch')
          (Path(env['RUNNER_TEMP']) / 'independent-sandbox-inventory.json').write_bytes(raw)
          PY
      - name: Authenticate inventory evidence publication
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Attest independently measured inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/ecryptoguru/lyrashield-sandbox
          subject-digest: ${{ inputs.index_digest }}
          predicate-type: https://lyrashieldai.com/attestations/sandbox-independent-inventory/v1
          predicate-path: ${{ runner.temp }}/independent-sandbox-inventory.json
          push-to-registry: true
          create-storage-record: false
