name: Publish verified sandbox

on:
  push:
    tags: ["sandbox-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/lyrashield-sandbox

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and push an unqualified candidate
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: containers/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Smoke the exact candidate digest
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}"
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" "$image" sh -lc '
              test "$(id -u)" != "0" &&
              test ! -S /var/run/docker.sock &&
              getcap /usr/lib/nmap/nmap | grep -q "cap_net_raw" &&
              nmap -sn 127.0.0.1 >/dev/null &&
              status="$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:48080/graphql/)" &&
              case "$status" in 200|400) exit 0 ;; *) exit 1 ;; esac
            '
          done
      - name: Promote the smoke-qualified digest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}"
          docker buildx imagetools create \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$RELEASE_TAG" \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            "$image"

          for tag in "$RELEASE_TAG" "${{ github.sha }}"; do
            promoted_digest="$(docker buildx imagetools inspect \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$tag" | awk '/^Digest:/ { print $2; exit }')"
            test "$promoted_digest" = "${{ steps.image.outputs.digest }}"
          done
      - name: Generate an SPDX SBOM for the published digest
        id: sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          output-file: sandbox.spdx.json
          artifact-name: lyrashield-sandbox-${{ github.sha }}.spdx.json
          upload-release-assets: false
      - name: Sign provenance for the immutable image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest the generated SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: sandbox.spdx.json
          push-to-registry: true
      - name: Record deployable immutable reference
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}"
          printf 'LYRASHIELD_IMAGE=%s\n' "$image" >> "$GITHUB_STEP_SUMMARY"
          printf 'Verify with: gh attestation verify oci://%s -R %s\n' "$image" "${{ github.repository }}" >> "$GITHUB_STEP_SUMMARY"
