name: Publish verified sandbox

on:
  push:
    tags: ["sandbox-v*"]
  workflow_dispatch:
    inputs:
      engine_revision:
        description: "Optional full SHA of an already qualified engine commit on main"
        type: string
        required: false

permissions:
  contents: read
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/lyrashield-sandbox

jobs:
  resolve:
    name: Resolve qualified engine revision
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sandbox-v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      ci_run: ${{ steps.source.outputs.ci_run }}
      ci_attempt: ${{ steps.source.outputs.ci_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve a qualified exact engine revision
        id: source
        env:
          REQUESTED_RUNTIME: ${{ inputs.engine_revision }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          revision="${REQUESTED_RUNTIME:-$GITHUB_SHA}"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          # Historical releases require an explicit, reviewed qualification.
          # The M engine revision completed the full derivative and worker gates.
          qualified_historical="992b3d9df696753c7b62a31ea58f1ca5d21055c1"
          [[ "$revision" == "$GITHUB_SHA" || "$revision" == "$qualified_historical" ]]
          test "$(git rev-parse --verify "$revision^{commit}")" = "$revision"
          git merge-base --is-ancestor "$revision" "$GITHUB_SHA"
          # The jq variable is interpreted by jq, not by the shell.
          # shellcheck disable=SC2016
          ci_record="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$revision" -f event=push -f status=success -f per_page=100 | \
            jq -c --arg revision "$revision" \
            '[.workflow_runs[] | select(.head_sha == $revision and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success") | {id, attempt: .run_attempt}] | max_by(.id) // empty')"
          [[ -n "$ci_record" ]]
          ci_run="$(jq -r '.id' <<< "$ci_record")"
          ci_attempt="$(jq -r '.attempt' <<< "$ci_record")"
          [[ "$ci_run" =~ ^[1-9][0-9]*$ && "$ci_attempt" =~ ^[1-9][0-9]*$ ]]
          printf 'revision=%s\nci_run=%s\nci_attempt=%s\n' "$revision" "$ci_run" "$ci_attempt" >> "$GITHUB_OUTPUT"

  build:
    name: Build sandbox (${{ matrix.arch }})
    needs: resolve
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          path: runtime
          persist-credentials: false
      - name: Verify selected runtime checkout
        env:
          RUNTIME_REVISION: ${{ needs.resolve.outputs.revision }}
        run: test "$(git -C runtime rev-parse HEAD)" = "$RUNTIME_REVISION"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Hydrate qualified runtime inputs
        working-directory: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 containers/system-python-security/hydrate_runtime_inputs.py --download
      - name: Build and push an unqualified native candidate
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: runtime
          file: runtime/containers/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.revision }}
          provenance: mode=max
          sbom: true
      - name: Smoke the exact native candidate digest
        working-directory: runtime
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="$REGISTRY/$IMAGE_NAME@$DIGEST"
          bash scripts/smoke-sandbox.sh "$image" "linux/$ARCH"
      - name: Audit byte-bound Go application coordinates
        working-directory: runtime
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME@$DIGEST"
          bash scripts/audit-sandbox-go-applications.sh "$image" "linux/$ARCH"
      - name: Record qualified native digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digest"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-native-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/digest
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish qualified sandbox index
    needs: [resolve, build]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sandbox-native-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/amd64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sandbox-native-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/arm64
      - name: Assemble and verify qualified platform index
        id: index
        env:
          RUNTIME_REVISION: ${{ needs.resolve.outputs.revision }}
          ENGINE_CI_RUN: ${{ needs.resolve.outputs.ci_run }}
          ENGINE_CI_ATTEMPT: ${{ needs.resolve.outputs.ci_attempt }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          amd="$(cat evidence/amd64/digest)"
          arm="$(cat evidence/arm64/digest)"
          [[ "$amd" =~ ^sha256:[0-9a-f]{64}$ && "$arm" =~ ^sha256:[0-9a-f]{64}$ && "$amd" != "$arm" ]]
          docker buildx imagetools inspect "$image@$amd" --raw > evidence/amd64.json
          docker buildx imagetools inspect "$image@$arm" --raw > evidence/arm64.json
          tag="$image:candidate-index-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx imagetools create --metadata-file evidence/index-metadata.json --tag "$tag" "$image@$amd" "$image@$arm"
          digest="$(python3 -c 'import json; print(json.load(open("evidence/index-metadata.json"))["containerimage.descriptor"]["digest"])')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$image@$digest" --raw > evidence/combined.json
          python3 scripts/verify_sandbox_platform_index.py evidence/amd64.json evidence/arm64.json evidence/combined.json \
            --amd64-digest "$amd" --arm64-digest "$arm" --metadata evidence/index-metadata.json > evidence/children.json
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          python3 - "$amd" "$arm" "$digest" <<'PY'
          import json, os, sys
          evidence = {
              "schema": "lyrashield.sandbox.qualification.v1",
              "engineRevision": os.environ["RUNTIME_REVISION"],
              "workflowRevision": os.environ["GITHUB_SHA"],
              "engineCiRun": os.environ["ENGINE_CI_RUN"],
              "engineCiAttempt": os.environ["ENGINE_CI_ATTEMPT"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "platformIndexes": {"amd64": sys.argv[1], "arm64": sys.argv[2]},
              "platformManifests": json.load(open("evidence/children.json", encoding="utf8")),
              "indexDigest": sys.argv[3],
          }
          with open("evidence/qualification.json", "w", encoding="utf8") as out:
              json.dump(evidence, out, sort_keys=True, separators=(",", ":"))
          PY
      - name: Install checksum-pinned Syft
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 180 \
            https://github.com/anchore/syft/releases/download/v1.56.0/syft_1.56.0_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/syft.tar.gz"
          printf '%s  %s\n' 1c2493cfcf52d3367d6cb25780d9190c111c2219c34c820574c43e8bae15c528 "$RUNNER_TEMP/syft.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP" syft
          python3 scripts/check_syft_cataloger.py "$RUNNER_TEMP/syft"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.6
      - name: Generate per-platform SPDX SBOMs
        env:
          INDEX_DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          mkdir -p evidence/sboms
          for arch in amd64 arm64; do
            child="$(python3 -c 'import json,sys; print(json.load(open("evidence/children.json"))[sys.argv[1]])' "$arch")"
            [[ "$child" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker buildx imagetools inspect "$image@$child" --raw > "evidence/$arch.manifest.json"
            syft scan "registry:$image@$child" --platform "linux/$arch" \
              -o "spdx-json=evidence/sboms/sandbox-$arch.spdx.json"
          done
      - name: Attach and validate complete SBOM artifact
        id: sbom
        env:
          INDEX_DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          (
            cd evidence/sboms
            oras attach --artifact-type application/vnd.lyrashield.sandbox-sbom.v1 \
              --export-manifest ../sbom-artifact.json --format json "$image@$INDEX_DIGEST" \
              sandbox-amd64.spdx.json:application/spdx+json \
              sandbox-arm64.spdx.json:application/spdx+json > ../sbom-attach.json
          )
          artifact="$(python3 -c 'import json,sys; x=json.load(open("evidence/sbom-attach.json")); assert x["reference"] == sys.argv[1]+"@"+x["digest"]; print(x["digest"])' "$image")"
          [[ "$artifact" =~ ^sha256:[0-9a-f]{64}$ ]]
          python3 scripts/prepare_sandbox_sbom.py \
            --qualification evidence/qualification.json --index-metadata evidence/index-metadata.json \
            --amd64-manifest evidence/amd64.manifest.json --arm64-manifest evidence/arm64.manifest.json \
            --artifact-manifest evidence/sbom-artifact.json --artifact-digest "$artifact" \
            --image "$image" --sbom-dir evidence/sboms --output evidence/sbom-predicate.json
          printf 'artifact=%s\n' "$artifact" >> "$GITHUB_OUTPUT"
      - name: Sign provenance for the immutable image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Sign selected runtime and qualified platform binding
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.index.outputs.digest }}
          predicate-type: https://lyrashieldai.com/attestations/sandbox-qualification/v1
          predicate-path: evidence/qualification.json
          push-to-registry: true
          create-storage-record: false
      - name: Sign per-platform SBOM binding
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.index.outputs.digest }}
          predicate-type: https://lyrashieldai.com/attestations/sandbox-sbom/v1
          predicate-path: evidence/sbom-predicate.json
          push-to-registry: true
          create-storage-record: false
      - name: Verify signed sandbox publication
        env:
          INDEX_DIGEST: ${{ steps.index.outputs.digest }}
          ARTIFACT_DIGEST: ${{ steps.sbom.outputs.artifact }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          mkdir -p evidence/verified evidence/retrieved
          for pair in \
            'provenance https://slsa.dev/provenance/v1' \
            'qualification https://lyrashieldai.com/attestations/sandbox-qualification/v1' \
            'sbom https://lyrashieldai.com/attestations/sandbox-sbom/v1'; do
            read -r name predicate <<< "$pair"
            verified=false
            for _ in 1 2 3 4 5; do
              if gh attestation verify "oci://$image@$INDEX_DIGEST" --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-sandbox.yml" \
                --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
                --deny-self-hosted-runners --bundle-from-oci --predicate-type "$predicate" --format json \
                > "evidence/verified/$name.json"; then
                verified=true
                break
              fi
              sleep 5
            done
            [[ "$verified" == true ]]
          done
          python3 scripts/check_sandbox_attestations.py \
            --repo "$GITHUB_REPOSITORY" --image "$image" --digest "$INDEX_DIGEST" \
            --revision "$GITHUB_SHA" --ref "$GITHUB_REF" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --phase publication \
            --provenance evidence/verified/provenance.json \
            --qualification evidence/verified/qualification.json --sbom evidence/verified/sbom.json \
            --expected-qualification evidence/qualification.json --expected-sbom evidence/sbom-predicate.json
          oras manifest fetch "$image@$ARTIFACT_DIGEST" > evidence/retrieved-artifact.json
          oras pull "$image@$ARTIFACT_DIGEST" --output evidence/retrieved
          python3 scripts/prepare_sandbox_sbom.py \
            --qualification evidence/qualification.json --index-metadata evidence/index-metadata.json \
            --amd64-manifest evidence/amd64.manifest.json --arm64-manifest evidence/arm64.manifest.json \
            --artifact-manifest evidence/retrieved-artifact.json --artifact-digest "$ARTIFACT_DIGEST" \
            --image "$image" --sbom-dir evidence/retrieved --output evidence/retrieved-predicate.json
          cmp evidence/sbom-predicate.json evidence/retrieved-predicate.json
      - name: Install checksum-pinned Go metadata inspector
        run: |
          set -euo pipefail
          go_archive="$RUNNER_TEMP/go1.27.3.linux-amd64.tar.gz"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 180 \
            https://go.dev/dl/go1.27.3.linux-amd64.tar.gz --output "$go_archive"
          printf '%s  %s\n' 65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40 "$go_archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/go-metadata"
          tar -xzf "$go_archive" -C "$RUNNER_TEMP/go-metadata" go/bin/go
          go_tool="$RUNNER_TEMP/go-metadata/go/bin/go"
          test "$("$go_tool" version)" = 'go version go1.27.3 linux/amd64'
          go_tool_sha256="$(sha256sum "$go_tool" | cut -d' ' -f1)"
          [[ "$go_tool_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'GO_METADATA_TOOL=%s\nGO_METADATA_TOOL_SHA256=%s\n' "$go_tool" "$go_tool_sha256" >> "$GITHUB_ENV"
      - name: Qualify bounded SBOM coverage on both native images
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          docker_server_raw="$(docker version --format '{{.Server.Version}}/{{.Server.GitCommit}}')"
          [[ "$docker_server_raw" =~ ^[A-Za-z0-9._+/:-]{1,256}$ ]]
          container=""
          child=""
          platform_dir=""
          cleanup_platform() {
            if [[ -n "$container" ]]; then
              docker rm -f "$container" >/dev/null 2>&1 || true
              container=""
            fi
            if [[ -n "$child" ]]; then
              docker image rm "$image@$child" >/dev/null 2>&1 || true
            fi
            if [[ -n "$platform_dir" ]]; then
              rm -f "$platform_dir/rootfs.tar"
              rm -rf "$platform_dir/captures"
            fi
          }
          trap cleanup_platform EXIT
          for arch in amd64 arm64; do
            cleanup_platform
            platform_dir="evidence/coverage/$arch"
            install -d -m 700 "$platform_dir" "$platform_dir/captures"
            child="$(python3 -c 'import json,sys; print(json.load(open("evidence/qualification.json"))["platformManifests"][sys.argv[1]])' "$arch")"
            [[ "$child" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker buildx imagetools inspect "$image@$child" --raw > "$platform_dir/manifest.json"
            read -r config_digest config_size < <(
              python3 - "$platform_dir/manifest.json" "$child" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          path, expected = Path(sys.argv[1]), sys.argv[2]
          raw = path.read_bytes()
          if "sha256:" + hashlib.sha256(raw).hexdigest() != expected and raw.endswith(b"\n"):
              normalized = raw[:-1]
              if "sha256:" + hashlib.sha256(normalized).hexdigest() != expected:
                  raise SystemExit("manifest bytes differ from qualified child")
              raw = normalized
          elif "sha256:" + hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit("manifest bytes differ from qualified child")
          manifest = json.loads(raw)
          config = manifest["config"]
          assert manifest["schemaVersion"] == 2
          assert isinstance(config["digest"], str) and len(config["digest"]) == 71
          assert type(config["size"]) is int and config["size"] > 0
          print(config["digest"], config["size"])
          PY
            )
            [[ "$config_digest" =~ ^sha256:[0-9a-f]{64}$ && "$config_size" =~ ^[1-9][0-9]*$ ]]
            oras blob fetch --output "$platform_dir/config.json" "$image@$config_digest"
            test "$(stat -c %s "$platform_dir/config.json")" = "$config_size"
            docker pull --platform "linux/$arch" "$image@$child" >/dev/null
            container="$(docker create --platform "linux/$arch" --network none "$image@$child")"
            [[ "$container" =~ ^[0-9a-f]{64}$ ]]
            docker image inspect "$image@$child" > "$platform_dir/image-inspect.json"
            docker inspect "$container" > "$platform_dir/container-inspect.json"
            # The positional parameters are intentionally evaluated by the child bash process.
            # shellcheck disable=SC2016
            timeout 900s bash -c 'set -o pipefail; docker export "$1" | head -c 8589934593 > "$2"' _ "$container" "$platform_dir/rootfs.tar"
            rootfs_size="$(stat -c %s "$platform_dir/rootfs.tar")"
            test "$rootfs_size" -le 8589934592
            rootfs_digest="sha256:$(sha256sum "$platform_dir/rootfs.tar" | cut -d' ' -f1)"
            python3 -m scripts.check_sandbox_sbom_coverage platform \
              --architecture "$arch" --image "$image" \
              --qualification evidence/qualification.json --sbom-predicate evidence/sbom-predicate.json \
              --manifest "$platform_dir/manifest.json" --config "$platform_dir/config.json" \
              --image-inspect "$platform_dir/image-inspect.json" \
              --container-inspect "$platform_dir/container-inspect.json" \
              --container-id "$container" \
              --rootfs "$platform_dir/rootfs.tar" --expected-rootfs-digest "$rootfs_digest" \
              --spdx "evidence/retrieved/sandbox-$arch.spdx.json" \
              --go-tool "$GO_METADATA_TOOL" --expected-go-tool-digest "$GO_METADATA_TOOL_SHA256" \
              --applications containers/go-tools/applications.json \
              --distro-applications containers/go-tools/distro/applications.cdx.json \
              --docker-server "$docker_server_raw" \
              --capture-dir "$platform_dir/captures" --output "$platform_dir/receipt.json"
            sha256sum "$platform_dir/receipt.json" > "$platform_dir/receipt.sha256"
            cleanup_platform
          done
          trap - EXIT
          test -f evidence/coverage/amd64/receipt.json
          test -f evidence/coverage/arm64/receipt.json
      - name: Assemble bounded SBOM coverage predicate
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          docker_server_raw="$(docker version --format '{{.Server.Version}}/{{.Server.GitCommit}}')"
          [[ "$docker_server_raw" =~ ^[A-Za-z0-9._+/:-]{1,256}$ ]]
          python3 -m scripts.check_sandbox_sbom_coverage aggregate \
            --qualification evidence/qualification.json --sbom-predicate evidence/sbom-predicate.json \
            --image "$image" \
            --applications containers/go-tools/applications.json \
            --distro-applications containers/go-tools/distro/applications.cdx.json \
            --expected-go-tool-digest "$GO_METADATA_TOOL_SHA256" \
            --docker-server "$docker_server_raw" \
            --amd64-receipt evidence/coverage/amd64/receipt.json \
            --arm64-receipt evidence/coverage/arm64/receipt.json \
            --output evidence/coverage/coverage-predicate.json
          sha256sum evidence/coverage/coverage-predicate.json > evidence/coverage/coverage-predicate.sha256
      - name: Sign bounded SBOM coverage qualification
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.index.outputs.digest }}
          predicate-type: https://lyrashieldai.com/attestations/sandbox-sbom-coverage/v1
          predicate-path: evidence/coverage/coverage-predicate.json
          push-to-registry: true
          create-storage-record: false
      - name: Verify signed sandbox publication coverage
        env:
          INDEX_DIGEST: ${{ steps.index.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          verified=false
          for _ in 1 2 3 4 5; do
            if gh attestation verify "oci://$image@$INDEX_DIGEST" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-sandbox.yml" \
              --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners --bundle-from-oci \
              --predicate-type https://lyrashieldai.com/attestations/sandbox-sbom-coverage/v1 --format json \
              > evidence/verified/coverage.json; then
              verified=true
              break
            fi
            sleep 5
          done
          [[ "$verified" == true ]]
          python3 scripts/check_sandbox_attestations.py \
            --repo "$GITHUB_REPOSITORY" --image "$image" --digest "$INDEX_DIGEST" \
            --revision "$GITHUB_SHA" --ref "$GITHUB_REF" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --phase coverage \
            --provenance evidence/verified/provenance.json \
            --qualification evidence/verified/qualification.json --sbom evidence/verified/sbom.json \
            --coverage evidence/verified/coverage.json \
            --expected-qualification evidence/qualification.json \
            --expected-sbom evidence/sbom-predicate.json \
            --expected-coverage evidence/coverage/coverage-predicate.json
      - name: Upload bounded SBOM coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-sbom-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/coverage
          if-no-files-found: error
          retention-days: 30
      - name: Hold promotion pending independent package coverage
        run: |
          echo '::error::Independent package coverage for both native images has not been qualified.'
          exit 1
      - name: Promote the smoke-qualified digest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RUNTIME_REVISION: ${{ needs.resolve.outputs.revision }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME@$DIGEST"
          docker buildx imagetools create --tag "$REGISTRY/$IMAGE_NAME:$RELEASE_TAG" --tag "$REGISTRY/$IMAGE_NAME:$RUNTIME_REVISION" "$image"
          for tag in "$RELEASE_TAG" "$RUNTIME_REVISION"; do
            promoted_digest="$(docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME:$tag" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
            test "$promoted_digest" = "$DIGEST"
          done
      - name: Record deployable immutable reference
        env:
          RUNTIME_REVISION: ${{ needs.resolve.outputs.revision }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          image="$REGISTRY/$IMAGE_NAME@$DIGEST"
          printf 'LYRASHIELD_IMAGE=%s\nENGINE_REVISION=%s\nWORKFLOW_REVISION=%s\n' "$image" "$RUNTIME_REVISION" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'Verify with: gh attestation verify oci://%s -R %s\n' "$image" "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
