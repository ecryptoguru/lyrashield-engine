# Modifications © 2026 LyraShield; based on upstream Strix (Apache-2.0)
# FF3 — Signed + notarized Tauri desktop release pipeline.
#
# On tag push (v*), builds and signs the Tauri desktop shell for macOS, Windows,
# and Linux. macOS builds are codesigned + notarized + stapled. Windows builds
# are Authenticode-signed (EV cert for SmartScreen reputation). Linux builds
# produce .AppImage + .deb with a GPG-signed .AppImage.
#
# Notarization/stapling failures fail the build. Signing keys come from
# repository secrets — never embedded in the repo.

name: release-tauri

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      LYRASHIELD_LICENSE_PUBKEY_HEX: ${{ secrets.LYRASHIELD_LICENSE_PUBKEY_HEX }}
      LYRASHIELD_UPDATER_PUBKEY: ${{ secrets.LYRASHIELD_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Verify release inputs and version
        run: |
          set -euo pipefail
          for name in \
            APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
            WINDOWS_CERTIFICATE_PFX WINDOWS_CERTIFICATE_PASSWORD GPG_PRIVATE_KEY GPG_PASSPHRASE \
            TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            LYRASHIELD_LICENSE_PUBKEY_HEX LYRASHIELD_UPDATER_PUBKEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required release secret $name is missing"
              exit 1
            fi
          done
          python3 - <<'PY'
          import json, os, pathlib, tomllib

          engine = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          shell = json.loads(pathlib.Path("desktop/src-tauri/tauri.conf.json").read_text())["version"]
          ui = json.loads(pathlib.Path("desktop/ui/package.json").read_text())["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if len({engine, shell, ui, tag}) != 1:
              raise SystemExit(f"release version mismatch: engine={engine}, shell={shell}, ui={ui}, tag={tag}")
          PY

  # ---------------------------------------------------------------------------
  # macOS — codesign + notarize + staple
  # ---------------------------------------------------------------------------
  release-macos:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            artifact: lyrashield-local-macos-aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: lyrashield-local-macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Inject release public keys (fail-closed)
        env:
          LYRASHIELD_LICENSE_PUBKEY_HEX: ${{ secrets.LYRASHIELD_LICENSE_PUBKEY_HEX }}
          LYRASHIELD_UPDATER_PUBKEY: ${{ secrets.LYRASHIELD_UPDATER_PUBKEY }}
        run: bash scripts/inject-release-pubkeys.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-22
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: desktop/ui
        run: npm ci

      - name: Build engine sidecar (version-matched)
        run: |
          set -euo pipefail
          bash scripts/build.sh
          ENGINE_VERSION="$(./dist/strix --version | awk '{print $NF}' | tr -d '[:space:]')"
          if [ "v${ENGINE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "engine sidecar version ${ENGINE_VERSION} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          mkdir -p desktop/src-tauri/binaries
          cp dist/strix "desktop/src-tauri/binaries/lyrashield-engine-${{ matrix.target }}"
          chmod +x "desktop/src-tauri/binaries/lyrashield-engine-${{ matrix.target }}"

      - name: Import Apple Developer certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_FILE=$(mktemp /tmp/certificate.XXXXXX.p12)
          KEYCHAIN_FILE=$(mktemp /tmp/keychain.XXXXXX.keychain-db)
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_FILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security import "$CERT_FILE" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_FILE"
          security set-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security list-keychain -d user -s "$KEYCHAIN_FILE"
          APPLE_SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_FILE" | awk -F'"' 'NR == 1 { print $2 }')"
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "No usable Apple code-signing identity was imported." >&2
            exit 1
          fi
          echo "KEYCHAIN_FILE=$KEYCHAIN_FILE" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build + codesign + notarize (Tauri)
        uses: tauri-apps/tauri-action@2d793bf2c8c505b9b76211601b09aab48922225d # v1.0.0
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LYRASHIELD_LICENSE_PUBKEY_HEX: ${{ secrets.LYRASHIELD_LICENSE_PUBKEY_HEX }}
        with:
          projectPath: desktop/src-tauri
          args: --target ${{ matrix.target }}

      - name: Verify notarization staple
        run: |
          BUNDLE=$(find desktop/src-tauri/target -name "LyraShield Local.app" | head -1)
          test -n "$BUNDLE"
          xcrun stapler validate "$BUNDLE"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz.sig

  # ---------------------------------------------------------------------------
  # Windows — Authenticode sign (EV cert for SmartScreen reputation)
  # ---------------------------------------------------------------------------
  release-windows:
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Inject release public keys (fail-closed)
        shell: bash
        env:
          LYRASHIELD_LICENSE_PUBKEY_HEX: ${{ secrets.LYRASHIELD_LICENSE_PUBKEY_HEX }}
          LYRASHIELD_UPDATER_PUBKEY: ${{ secrets.LYRASHIELD_UPDATER_PUBKEY }}
        run: bash scripts/inject-release-pubkeys.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-22
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: desktop/ui
        run: npm ci

      - name: Build engine sidecar (version-matched)
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build.sh
          ENGINE_VERSION="$(./dist/strix.exe --version | awk '{print $NF}' | tr -d '[:space:]')"
          if [ "v${ENGINE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "engine sidecar version ${ENGINE_VERSION} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          mkdir -p desktop/src-tauri/binaries
          cp dist/strix.exe desktop/src-tauri/binaries/lyrashield-engine-x86_64-pc-windows-msvc.exe

      - name: Import Windows Authenticode certificate
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certPath = [System.IO.Path]::GetTempFileName() + ".pfx"
          [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX) | Set-Content $certPath -AsByteStream
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.HasPrivateKey) { throw "Imported Windows signing certificate has no private key." }
          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          }
          $config | ConvertTo-Json -Depth 4 | Set-Content desktop/src-tauri/tauri.windows.conf.json
          echo "CERT_PATH=$certPath" >> $env:GITHUB_ENV

      - name: Build (Tauri)
        uses: tauri-apps/tauri-action@2d793bf2c8c505b9b76211601b09aab48922225d # v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LYRASHIELD_LICENSE_PUBKEY_HEX: ${{ secrets.LYRASHIELD_LICENSE_PUBKEY_HEX }}
        with:
          projectPath: desktop/src-tauri
          args: --config tauri.windows.conf.json

      - name: Verify Windows installer signatures
        run: |
          $msi = Get-ChildItem -Path desktop/src-tauri/target -Recurse -Filter "*.msi" | Select-Object -First 1
          $nsis = Get-ChildItem -Path desktop/src-tauri/target -Recurse -Filter "*.exe" | Where-Object { $_.Name -notmatch "LyraShield Local\.exe$" } | Select-Object -First 1
          if (-not $msi -and -not $nsis) { throw "No Windows installer was built." }
          foreach ($f in @($msi, $nsis)) {
            if ($f) {
              signtool verify /pa /v $f.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($f.FullName)." }
            }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lyrashield-local-windows
          path: |
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.msi.sig
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.exe.sig

  # ---------------------------------------------------------------------------
  # Linux — .AppImage + .deb, GPG-signed .AppImage
  # ---------------------------------------------------------------------------
  release-linux:
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Inject release public keys (fail-closed)
        env:
          LYRASHIELD_LICENSE_PUBKEY_HEX: ${{ secrets.LYRASHIELD_LICENSE_PUBKEY_HEX }}
          LYRASHIELD_UPDATER_PUBKEY: ${{ secrets.LYRASHIELD_UPDATER_PUBKEY }}
        run: bash scripts/inject-release-pubkeys.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-22

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install UI dependencies
        working-directory: desktop/ui
        run: npm ci

      - name: Build engine sidecar (version-matched)
        run: |
          set -euo pipefail
          bash scripts/build.sh
          ENGINE_VERSION="$(./dist/strix --version | awk '{print $NF}' | tr -d '[:space:]')"
          if [ "v${ENGINE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "engine sidecar version ${ENGINE_VERSION} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          mkdir -p desktop/src-tauri/binaries
          cp dist/strix desktop/src-tauri/binaries/lyrashield-engine-x86_64-unknown-linux-gnu
          chmod +x desktop/src-tauri/binaries/lyrashield-engine-x86_64-unknown-linux-gnu

      - name: Build (Tauri)
        uses: tauri-apps/tauri-action@2d793bf2c8c505b9b76211601b09aab48922225d # v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LYRASHIELD_LICENSE_PUBKEY_HEX: ${{ secrets.LYRASHIELD_LICENSE_PUBKEY_HEX }}
        with:
          projectPath: desktop/src-tauri

      - name: GPG-sign AppImage
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          APPIMAGE=$(find desktop/src-tauri/target -name "*.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage was built." >&2
            exit 1
          fi
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --detach-sign --armor --output "$APPIMAGE.sig" "$APPIMAGE"
          gpg --verify "$APPIMAGE.sig" "$APPIMAGE"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lyrashield-local-linux
          path: |
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.AppImage.sig
            desktop/src-tauri/target/release/bundle/**/*.AppImage.tar.gz
            desktop/src-tauri/target/release/bundle/**/*.AppImage.tar.gz.sig
            desktop/src-tauri/target/release/bundle/**/*.deb

  # ---------------------------------------------------------------------------
  # Publish — create the GitHub Release with all signed artifacts + the
  # updater manifest (latest.json) that the Tauri updater consumes.
  # ---------------------------------------------------------------------------
  publish-release:
    needs: [release-macos, release-windows, release-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: artifacts

      - name: Assemble updater manifest from the complete platform set
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, sys, datetime, urllib.parse

          artifacts = pathlib.Path("artifacts")
          def find_one(artifact_dir, pattern):
              files = sorted((artifacts / artifact_dir).rglob("*"))
              hits = [f for f in files if f.is_file() and f.name.endswith(pattern) and not f.name.endswith(".sig")]
              sigs = [f for f in files if f.is_file() and f.name.endswith(pattern + ".sig")]
              if not hits or not sigs:
                  return None
              return hits[0], sigs[0].read_text(encoding="utf-8").strip()

          darwin_arm = find_one("lyrashield-local-macos-aarch64", ".app.tar.gz")
          darwin_x64 = find_one("lyrashield-local-macos-x86_64", ".app.tar.gz")
          windows = find_one("lyrashield-local-windows", ".msi") or find_one("lyrashield-local-windows", "-setup.exe")
          linux = find_one("lyrashield-local-linux", ".AppImage.tar.gz")
          missing = [name for name, hit in
                     (("darwin-aarch64", darwin_arm), ("darwin-x86_64", darwin_x64),
                      ("windows", windows), ("linux", linux)) if hit is None]
          if missing:
              sys.exit(f"updater manifest incomplete, missing artifacts/signatures: {missing}")

          full_tag = os.environ.get("GITHUB_REF_NAME", "")
          if not full_tag or full_tag.startswith("-"):
              sys.exit("GITHUB_REF_NAME is missing or invalid")
          tag = full_tag.lstrip("v")
          base = "https://github.com/ecryptoguru/lyrashield-engine/releases/download/" + full_tag
          def entry(pair):
              artifact, sig = pair
              return {"signature": sig, "url": base + "/" + urllib.parse.quote(artifact.name)}

          manifest = {
              "version": tag,
              "notes": "LyraShield Local release " + tag,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platforms": {
                  "darwin-aarch64": entry(darwin_arm),
                  "darwin-x86_64": entry(darwin_x64),
                  "windows-x86_64": entry(windows),
                  "linux-x86_64": entry(linux),
              },
          }
          pathlib.Path("latest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          print("latest.json assembled for", tag)
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.exe.sig
            artifacts/**/*.app.tar.gz
            artifacts/**/*.app.tar.gz.sig
            artifacts/**/*.AppImage
            artifacts/**/*.AppImage.sig
            artifacts/**/*.deb
            latest.json
