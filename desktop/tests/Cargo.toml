# Modifications © 2026 LyraShield; based on upstream Strix (Apache-2.0)
# Standalone test crate for LyraShield Local desktop logic that does NOT
# require the full Tauri build (tauri::generate_context! needs the frontend
# dist). These tests exercise the pure-Rust logic modules (license signature
# verify, keychain abstraction, sync opt-in gate, docker detection, updater
# origin pin) by re-implementing the self-contained logic here so `cargo test`
# works without a Tauri context.
[package]
name = "lyrashield-local-tests"
version = "1.2.0"
edition = "2021"
publish = false

[dependencies]
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
rand = "0.8"
rand_core = "0.6"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
